name: Update Problem Radar

on:
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours
  workflow_dispatch: # Allows clicking "Run workflow" manually in GitHub UI

permissions:
  contents: write # Needed to commit data/problems.json back

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai

      - name: Fetch raw posts
        run: python scraper.py

      - name: Analyze problems with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyzer.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/problems.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update problem statements [skip ci]" && git push)
